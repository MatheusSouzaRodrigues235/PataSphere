services:
  db:
    image: postgres:18
    environment:
      POSTGRES_DB: patasphere
      POSTGRES_USER: patasphere
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Defina POSTGRES_PASSWORD no arquivo .env}
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
      - type: bind
        source: ./database/migrations
        target: /docker-entrypoint-initdb.d
        read_only: true
        bind:
          create_host_path: false

volumes:
  postgres_data: